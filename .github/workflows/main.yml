name: Build Gaming Hub APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buka zip proyek
        run: |
          if [ -f GamingHub.zip ]; then
            unzip -q -o GamingHub.zip
          fi
          if [ -d GamingHub ]; then
            echo "PROJECT_DIR=GamingHub" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" Gaming_Hub-V1.apk

      - name: Upload Gaming_Hub-V1.apk
        uses: actions/upload-artifact@v4
        with:
          name: Gaming_Hub-V1
          path: Gaming_Hub-V1.apk
          if-no-files-found: error
