name: Build Gaming Hub APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Ekstrak file zip yang terunggah
    - name: Ekstrak File Proyek ZIP
      run: |
        if [ -f "Gaming_Hub_Project.zip" ]; then
          echo "Menemukan Gaming_Hub_Project.zip, mengekstrak..."
          unzip -o Gaming_Hub_Project.zip -d .
        else
          echo "Mencari file .zip lain..."
          unzip -o *.zip -d . || echo "Tidak ada file zip ditemukan!"
        fi
        
        # Jika hasil ekstrak terbungkus folder, keluarkan semua ke root utama
        if [ -d "Gaming_Hub_Project" ]; then
          echo "Memindahkan file dari dalam folder Gaming_Hub_Project ke root..."
          mv Gaming_Hub_Project/* . || true
          mv Gaming_Hub_Project/.* . || true
        fi

    # 2. Setup Java versi terbaru (@v5)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: ''

    # 3. Generate ulang file gradlew yang rusak menggunakan Gradle bawaan environment runner
    - name: Regenerasi File Gradlew Resmi
      run: |
        echo "Menghapus gradlew lama yang rusak..."
        rm -f gradlew
        echo "Membuat ulang gradlew yang bersih dan kompatibel dengan Linux..."
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    # 4. Kompilasi proyek menjadi APK
    - name: Kompilasi APK Debug
      run: |
        ./gradlew assembleDebug

    # 5. Ambil hasil build dan unggah sebagai Gaming_Hub-V1
    - name: Unggah Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: Gaming_Hub-V1
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
