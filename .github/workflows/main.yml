name: Build Gaming Hub APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Ekstrak file zip yang terunggah di repositori
    - name: Ekstrak File Proyek ZIP
      run: |
        if [ -f "Gaming_Hub_Project.zip" ]; then
          echo "Menemukan Gaming_Hub_Project.zip, mengekstrak..."
          unzip -o Gaming_Hub_Project.zip -d .
        else
          echo "Mencari file .zip lain..."
          unzip -o *.zip -d . || echo "Tidak ada file zip ditemukan!"
        fi
        
        # Jika hasil ekstrak terbungkus folder, keluarkan semua represents ke root utama
        if [ -d "Gaming_Hub_Project" ] && [ -f "Gaming_Hub_Project/gradlew" ]; then
          echo "Memindahkan file dari dalam folder Gaming_Hub_Project ke root..."
          mv Gaming_Hub_Project/* . || true
          mv Gaming_Hub_Project/.* . || true
        fi
        echo "=== Isi folder root utama ==="
        ls -la

    # 2. Setup Java versi terbaru (@v5)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: ''

    # 3. Perbaiki format teks dan beri izin eksekusi pada script gradlew
    - name: Perbaiki Format dan Izin Eksekusi Gradle
      run: |
        if [ -f "gradlew" ]; then
          echo "Memperbaiki format baris teks Windows (CRLF) ke Linux (LF)..."
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
        else
          echo "File gradlew tidak ditemukan!"
          exit 1
        fi

    # 4. Kompilasi proyek menjadi APK
    - name: Kompilasi APK Debug
      run: |
        ./gradlew assembleDebug

    # 5. Ambil hasil build dan unggah sebagai Gaming_Hub-V1
    - name: Unggah Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: Gaming_Hub-V1
        path: app/build/outputs/apk/debug/app-debug.apk
